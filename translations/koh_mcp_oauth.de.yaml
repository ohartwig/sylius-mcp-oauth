claim:
    title: 'Agenten-Registrierung übernehmen'
    intro: 'Ein Agent hat sich bei diesem Shop registriert und bittet dich, ihn zu übernehmen. Sobald du bestätigst, kann er MCP-Zugriff in deinem Namen anfordern.'
    registration: 'Registrierung'
    registered_at: 'Registriert'
    warning: 'Bestätige nur, wenn dein Agent dir diesen Link und den Code gezeigt hat. Hast du das nicht ausgelöst, schließe die Seite: ohne den Code passiert nichts.'
    user_code: 'Sechsstelliger Code von deinem Agenten'
    confirm: 'Bestätigen und Zugriff gewähren'
    wrong_code: 'Der Code stimmt nicht. Verbleibende Versuche: %count%.'
    result:
        claimed: 'Erledigt. Dein Agent erhält den Zugriff bei seiner nächsten Abfrage; du kannst die Seite schließen. Widerrufen kannst du ihn jederzeit unter MCP-Tokens.'
        invalid: 'Dieser Link ist unbekannt, schon benutzt oder durch einen neueren ersetzt. Bitte deinen Agenten um einen neuen Link.'
        invalid_csrf: 'Das Formular ist abgelaufen. Öffne den Link von deinem Agenten erneut.'
        expired: 'Der Code ist abgelaufen. Bitte deinen Agenten um einen neuen Link und Code.'
        locked: 'Zu viele falsche Codes. Dieser Link funktioniert nicht mehr; bitte deinen Agenten um einen neuen.'
        wrong_account: 'Diese Registrierung gehört zu einem anderen Konto. Melde dich mit dem Konto an, das dein Agent genannt hat.'

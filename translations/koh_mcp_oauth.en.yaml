consent:
    title: 'Authorise MCP access'
    intro: '%client% wants to access this shop''s MCP server on your behalf.'
    client: 'Client'
    redirect_uri: 'You will be returned to'
    signed_in_as: 'Signed in as'
    scopes: 'Requested access'
    scope:
        mcp: 'Manage the shop through MCP (products, content, orders)'
        'mcp:read': 'Read the shop through MCP (products, catalogue structure, orders)'
        'mcp:write': 'Change the shop through MCP (catalogue, content, carts) — high-risk changes still need your confirmation in the client'
    warning: 'The client acts with your permissions until the token expires or you revoke it. Only authorise clients you started yourself.'
    approve: 'Authorise'
    deny: 'Deny'
error:
    title: 'MCP authorisation failed'
    invalid_client: 'Unknown client_id, or a redirect_uri this client has not registered.'
    redirect_uri_not_allowed: 'This redirect_uri is not on the allow-list of this server. Ask the operator to add it to koh_mcp_oauth.allowed_redirect_uris.'
    not_signed_in: 'No administrator is signed in.'
    invalid_csrf: 'The consent form has expired or is invalid. Please start again from your MCP client.'
    code: 'Error code'
admin:
    tokens:
        menu: 'MCP tokens'
        title: 'MCP access tokens'
        intro: 'Tokens agents use to act on behalf of an administrator. Revoking a token ends its whole authorization, refresh tokens included.'
        owner: 'Administrator'
        client: 'Client'
        cli: 'CLI token'
        scopes: 'Scopes'
        created: 'Issued'
        last_used: 'Last used'
        expires: 'Expires'
        never: 'never'
        status: 'Status'
        status_active: 'active'
        status_expired: 'expired'
        status_revoked: 'revoked'
        actions: 'Actions'
        revoke: 'Revoke'
        confirm: 'Revoke this token? The client loses access immediately.'
        revoked: 'Token revoked.'
        empty: 'No MCP tokens yet.'
claim:
    title: 'Claim an agent registration'
    intro: 'An agent registered with this shop and asks you to take ownership of it. Once you confirm, it can request MCP access acting as you.'
    registration: 'Registration'
    registered_at: 'Registered'
    warning: 'Only confirm if the agent you are using showed you this link and the code. If you did not start this, close the page: without the code nothing happens.'
    user_code: 'Six-digit code shown by your agent'
    confirm: 'Confirm and grant access'
    wrong_code: 'That code is not right. Attempts left: %count%.'
    result:
        claimed: 'Done. Your agent receives its access on its next poll; you can close this page. Revoke it at any time under MCP tokens.'
        invalid: 'This link is unknown, already used or has been replaced by a newer one. Ask your agent for a new link.'
        invalid_csrf: 'The form has expired. Open the link from your agent again.'
        expired: 'The code has expired. Ask your agent for a new link and code.'
        locked: 'Too many wrong codes. This link no longer works; ask your agent for a new one.'
        wrong_account: 'This registration is bound to a different account. Sign in with the account your agent named.'
